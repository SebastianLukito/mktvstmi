<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Scoreboard - Marketing IGR vs TMI/GA United</title>

    <!-- Open Graph / WhatsApp Preview -->

    <!-- Twitter Card (juga digunakan oleh beberapa app) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="⚽ Scoreboard — MKT IGR vs TMI/GA United" />
    <meta name="twitter:description" content="Lihat skor terkini dan rekap pertandingan Marketing IGR vs TMI/GA United secara realtime!" />
    <meta name="twitter:image" content="asset/mktlogo.png" />

    <!-- General Meta -->
    <meta name="description" content="Scoreboard realtime Marketing IGR vs TMI/GA United. Lihat skor, rekap pertandingan, dan riwayat aktivitas." />
    <meta name="theme-color" content="#0c1124" />

    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="asset/mktlogo.png">

    <!-- Tools styling now in styles.css -->
</head>

<body>
    <!-- Fire effects -->
    <div class="fire-left" aria-hidden="true">
        <div class="flame f1"></div>
        <div class="flame f2"></div>
        <div class="flame f3"></div>
        <div class="flame f4"></div>
        <div class="flame f5"></div>
        <div class="flame f6"></div>
        <div class="tongue t1"></div>
        <div class="tongue t2"></div>
        <div class="tongue t3"></div>
        <div class="tongue t4"></div>
    </div>
    <div class="fire-right" aria-hidden="true">
        <div class="flame f1"></div>
        <div class="flame f2"></div>
        <div class="flame f3"></div>
        <div class="flame f4"></div>
        <div class="flame f5"></div>
        <div class="flame f6"></div>
        <div class="tongue t1"></div>
        <div class="tongue t2"></div>
        <div class="tongue t3"></div>
        <div class="tongue t4"></div>
    </div>
    <header class="topbar">
    <div class="topbar-inner">
        <div class="brand">
        <span class="dot"></span>
        MKT IGR vs TMI/GA United
        </div>
        <nav style="display:flex;gap:8px;align-items:center">
        <button id="btnHistory" class="btn ghost" style="font-size:13px">📋 History</button>
        <a class="btn ghost" href="login.html">Login</a>
        </nav>
    </div>
    </header>

    <main class="container">
    <section class="hero">
        <div class="bg"></div>

        <div class="hero-score left">
        <div id="scoreMkt" class="num">0</div>
        </div>
        <div class="hero-score right">
        <div id="scoreTmi" class="num">0</div>
        </div>
    </section>

    <!-- TABLE -->
    <section class="panel">
        <div style="display:flex;justify-content:space-between; align-items:center;gap:12px;margin-bottom:10px">
        <h3 style="letter-spacing:.6px">Rekap Pertandingan</h3>
        <span class="badge" id="totalBadge">0 pertandingan</span>
        </div>

        <!-- TOOLS: Filter & Search -->
        <div class="table-tools">
        <div class="filters" id="publicFilters">
            <button class="btn ghost chip active" data-range="all">Semua</button>
            <button class="btn ghost chip" data-range="today">Hari ini</button>
            <button class="btn ghost chip" data-range="week">Minggu ini</button>
            <button class="btn ghost chip" data-range="month">Bulan ini</button>
        </div>

        <div class="search-wrap">
            <input id="publicSearch" class="input" placeholder="Cari… (contoh: Marketing menang)" />
            <button id="publicClear" class="btn ghost chip">Reset</button>
        </div>
        </div>

        <table class="table" id="tableBodyWrap">
        <thead>
            <tr>
            <th>#</th>
            <th>Marketing IGR</th>
            <th>TMI/GA United</th>
            <th>Pemenang</th>
            <th>Waktu</th>
            <th>Editor</th>
            </tr>
        </thead>
        <tbody id="tbodyMatches">
            <!-- diisi via JS -->
        </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <button class="page-btn" id="pageFirst">⟪ First</button>
            <button class="page-btn" id="pagePrev">‹ Prev</button>
            <span class="page-info" id="pageInfo">1 / 1</span>
            <button class="page-btn" id="pageNext">Next ›</button>
            <button class="page-btn" id="pageLast">Last ⟫</button>
        </div>
    </section>

    <!-- History Modal -->
    <div id="historyOverlay" class="history-overlay" aria-hidden="true">
        <div class="history-modal">
            <div class="history-header">
                <h3>📋 Riwayat Aktivitas Admin</h3>
                <button id="btnCloseHistory" class="btn ghost close-history" aria-label="Tutup">✕</button>
            </div>
            <div class="history-body" id="historyBody">
                <div class="history-empty">Memuat...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        ©WKWKWK
    </div>
    </main>

    <!-- Firebase + App (read-only) -->
    <script type="module">
    // === Firebase v9 modular (CDN) ===
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // Konfigurasi project kamu
    const firebaseConfig = {
        apiKey: "AIzaSyBKD7JAJHbeZC76XRoJ6lzVVwe0tLGSTno",
        authDomain: "mktvstmi.firebaseapp.com",
        projectId: "mktvstmi",
        storageBucket: "mktvstmi.firebasestorage.app",
        messagingSenderId: "608278579245",
        appId: "1:608278579245:web:4320f16e2a637343d110a4",
        measurementId: "G-0TJKX3M8L2"
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Elemen UI
    const tbody = document.getElementById('tbodyMatches');
    const badge = document.getElementById('totalBadge');
    const elM = document.getElementById('scoreMkt');
    const elT = document.getElementById('scoreTmi');

    // Filter/Search UI
    const filterWrap = document.getElementById('publicFilters');
    const filterBtns = [...filterWrap.querySelectorAll('button[data-range]')];
    const searchEl = document.getElementById('publicSearch');
    const clearBtn = document.getElementById('publicClear');

    // State
    let allMatches = [];
    let activeRange = 'all';
    let searchTerm = '';
    let currentView = [];
    let currentPage = 1;
    const perPage = 5;

    const fmt = new Intl.DateTimeFormat('id-ID', { dateStyle: 'medium', timeStyle: 'short' });

    const toDateSafe = (createdAt) => {
        if (createdAt?.toDate?.()) return createdAt.toDate();
        if (createdAt instanceof Date) return createdAt;
        const d = new Date(createdAt);
        return isNaN(d.getTime()) ? new Date() : d;
    };

    const startOfToday = () => {
        const d = new Date(); d.setHours(0, 0, 0, 0); return d;
    };
    const startOfWeek = () => {
        const d = startOfToday();
        const day = (d.getDay() + 6) % 7; // Monday=0
        d.setDate(d.getDate() - day);
        return d;
    };
    const startOfMonth = () => {
        const d = startOfToday(); d.setDate(1); return d;
    };

    const makeSearchText = (m) => {
        const marketing = m.mkt === 'W' ? 'marketing menang' : 'marketing kalah';
        const tmi = m.tmi === 'W' ? 'tmi menang' : 'tmi kalah';
        return `${m.winner} ${marketing} ${tmi} ${m.timeText}`.toLowerCase();
    };

    // Pagination elements
    const pageFirstBtn = document.getElementById('pageFirst');
    const pagePrevBtn = document.getElementById('pagePrev');
    const pageNextBtn = document.getElementById('pageNext');
    const pageLastBtn = document.getElementById('pageLast');
    const pageInfoEl = document.getElementById('pageInfo');

    const getTotalPages = (list) => Math.max(1, Math.ceil(list.length / perPage));

    const updatePagination = (list) => {
        const total = getTotalPages(list);
        if (currentPage > total) currentPage = total;
        pageInfoEl.textContent = `${currentPage} / ${total}`;
        pageFirstBtn.disabled = currentPage <= 1;
        pagePrevBtn.disabled = currentPage <= 1;
        pageNextBtn.disabled = currentPage >= total;
        pageLastBtn.disabled = currentPage >= total;
    };

    const getPageSlice = (list) => {
        const start = (currentPage - 1) * perPage;
        return { slice: list.slice(start, start + perPage), startIdx: start };
    };

    const renderTable = (list) => {
        if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:#86a2d2;padding:16px">Tidak ada data untuk filter/pencarian ini.</td></tr>`;
        updatePagination(list);
        return;
        }

        const { slice, startIdx } = getPageSlice(list);

        const rows = slice.map((m, idx) => `
        <tr>
            <td data-label="#">${startIdx + idx + 1}</td>
            <td data-label="Marketing IGR">${m.mkt === 'W' ? '<span class="badge ok">MENANG</span>' : '<span class="badge no">KALAH</span>'}</td>
            <td data-label="TMI/GA United">${m.tmi === 'W' ? '<span class="badge ok">MENANG</span>' : '<span class="badge no">KALAH</span>'}</td>
            <td data-label="Pemenang">${m.winner}</td>
            <td data-label="Waktu">${m.timeText}</td>
            <td data-label="Editor">${m.editor}</td>
        </tr>
        `);

        tbody.innerHTML = rows.join('');
        updatePagination(list);
    };

    const applyFilters = () => {
        const term = searchTerm.trim().toLowerCase();
        let list = allMatches.slice();

        let boundary = null;
        if (activeRange === 'today') boundary = startOfToday();
        if (activeRange === 'week') boundary = startOfWeek();
        if (activeRange === 'month') boundary = startOfMonth();
        if (boundary) list = list.filter(m => m.ts >= boundary);

        if (term) list = list.filter(m => m.search.includes(term));

        currentView = list;
        renderTable(list);
        badge.textContent = `${list.length} ditampilkan · ${allMatches.length} total`;
    };

    // UI events
    pageFirstBtn.addEventListener('click', () => { currentPage = 1; renderTable(currentView); });
    pagePrevBtn.addEventListener('click', () => { currentPage = Math.max(1, currentPage - 1); renderTable(currentView); });
    pageNextBtn.addEventListener('click', () => { currentPage = Math.min(getTotalPages(currentView), currentPage + 1); renderTable(currentView); });
    pageLastBtn.addEventListener('click', () => { currentPage = getTotalPages(currentView); renderTable(currentView); });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
        activeRange = btn.dataset.range;
        filterBtns.forEach(b => b.classList.toggle('active', b === btn));
        currentPage = 1;
        applyFilters();
        });
    });

    searchEl.addEventListener('input', (e) => {
        searchTerm = e.target.value || '';
        applyFilters();
    });

    clearBtn.addEventListener('click', () => {
        searchTerm = '';
        searchEl.value = '';
        activeRange = 'all';
        currentPage = 1;
        filterBtns.forEach(b => b.classList.toggle('active', b.dataset.range === 'all'));
        applyFilters();
    });

    // Stream data: koleksi 'matches' diurutkan terbaru
    const q = query(collection(db, 'matches'), orderBy('createdAt','desc'));
    onSnapshot(q, snap => {
        allMatches = [];
        let mWin = 0, tWin = 0;

        snap.forEach(docSnap => {
        const d = docSnap.data();

        if (d.mkt === 'W') mWin++;
        if (d.tmi === 'W') tWin++;

        const winner = d.mkt === 'W'
            ? 'Marketing IGR'
            : (d.tmi === 'W' ? 'TMI/GA United' : '-');

        const ts = toDateSafe(d.createdAt);
        const timeText = fmt.format(ts);

        const m = { id: docSnap.id, mkt: d.mkt, tmi: d.tmi, winner, ts, timeText, editor: d.createdByName || '-' };
        m.search = makeSearchText(m);

        allMatches.push(m);
        });

        // skor total (bukan hasil filter)
        elM.textContent = mWin;
        elT.textContent = tWin;

        applyFilters();
    });

    // === History Modal ===
    const historyOverlay = document.getElementById('historyOverlay');
    const historyBody = document.getElementById('historyBody');
    const btnHistory = document.getElementById('btnHistory');
    const btnCloseHistory = document.getElementById('btnCloseHistory');

    btnHistory.addEventListener('click', () => {
        historyOverlay.classList.add('show');
        historyOverlay.setAttribute('aria-hidden','false');
    });
    btnCloseHistory.addEventListener('click', () => {
        historyOverlay.classList.remove('show');
        historyOverlay.setAttribute('aria-hidden','true');
    });
    historyOverlay.addEventListener('click', (e) => {
        if (e.target === historyOverlay) {
            historyOverlay.classList.remove('show');
            historyOverlay.setAttribute('aria-hidden','true');
        }
    });

    const qHistory = query(collection(db, 'activity_log'), orderBy('timestamp','desc'), limit(50));
    onSnapshot(qHistory, snap => {
        if (snap.empty) {
            historyBody.innerHTML = '<div class="history-empty">Belum ada aktivitas tercatat.</div>';
            return;
        }
        let html = '';
        snap.forEach(docSnap => {
            const a = docSnap.data();
            const ts = toDateSafe(a.timestamp);
            const timeText = fmt.format(ts);
            const isAdd = a.action === 'add';
            const icon = isAdd ? '➕' : '🗑️';
            const cls = isAdd ? 'add' : 'delete';
            const text = isAdd
                ? `Menambahkan pertandingan: ${a.matchInfo || '-'}`
                : `Menghapus pertandingan: ${a.matchInfo || '-'}`;
            html += `
            <div class="history-item">
                <div class="history-icon ${cls}">${icon}</div>
                <div class="history-info">
                    <div class="history-admin">${a.adminName || 'Unknown'}</div>
                    <div class="history-action">${text}</div>
                    <div class="history-time">${timeText}</div>
                </div>
            </div>`;
        });
        historyBody.innerHTML = html;
    });
    </script>
</body>
</html>
